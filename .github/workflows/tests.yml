# Проверки управления, боевых подсказок и интерфейса на телефонных экранах в Chromium (tests/*.spec.mjs).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:input
      - run: npm run test:combat
      - run: npm run test:ui
      - run: npm run test:onboarding
      - run: npm run test:hits
      - run: npm run test:projectile
